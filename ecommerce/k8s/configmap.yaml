apiVersion: v1
kind: ConfigMap
metadata:
  name: ecommerce-config
data:
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_USER: postgres
  USERS_SERVICE_URL: http://users-service
  PRODUCTS_SERVICE_URL: http://products-service
  ORDERS_SERVICE_URL: http://orders-service
  PAYMENTS_SERVICE_URL: http://payments-service
  PROMOTIONS_SERVICE_URL: http://promotions-service
  SUPPORT_SERVICE_URL: http://support-service
  ADMIN_EMAIL: admin@example.com
  JWT_EXPIRE_MINUTES: "60"
