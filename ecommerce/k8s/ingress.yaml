apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ecommerce
  annotations:
    # Plain HTTP is redirected to HTTPS so credentials and tokens never cross the network unencrypted.
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    # Until this Secret exists ingress-nginx serves its self-signed default certificate.
    - secretName: ecommerce-tls
  rules:
    - http:
        paths:
          - path: /users
            pathType: Prefix
            backend:
              service:
                name: users-service
                port:
                  name: http
          - path: /products
            pathType: Prefix
            backend:
              service:
                name: products-service
                port:
                  name: http
          - path: /orders
            pathType: Prefix
            backend:
              service:
                name: orders-service
                port:
                  name: http
          - path: /payments
            pathType: Prefix
            backend:
              service:
                name: payments-service
                port:
                  name: http
          - path: /promotions
            pathType: Prefix
            backend:
              service:
                name: promotions-service
                port:
                  name: http
          - path: /support
            pathType: Prefix
            backend:
              service:
                name: support-service
                port:
                  name: http
